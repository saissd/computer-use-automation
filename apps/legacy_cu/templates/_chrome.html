<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html>
<head>
  <title>{% block title %}Member Services{% endblock %}</title>
  <style type="text/css">
    body { background:#d4d0c8; font-family:Verdana,Arial,sans-serif; font-size:11px; margin:0; padding:0; }
    table.panel { border:2px outset #d4d0c8; background:#d4d0c8; }
    table.grid { border:1px solid #7f9db9; background:#ffffff; border-collapse:collapse; }
    table.grid td, table.grid th { border:1px solid #c8c8c8; padding:3px 6px; font-size:11px; }
    table.grid th { background:#5a6b7c; color:#ffffff; text-align:left; font-weight:bold; }
    .hdr { background:#5a6b7c; color:#ffffff; font-weight:bold; padding:4px 8px; font-size:12px; }
    .err { background:#ffe8e8; border:1px solid #cc0000; color:#990000; padding:6px; font-size:11px; }
    .fielderr { color:#cc0000; font-size:10px; }
    input.txt, select.ddl { border:1px inset #808080; font-family:Verdana; font-size:11px; padding:1px; }
    input.btn { border:2px outset #d4d0c8; background:#d4d0c8; font-family:Verdana; font-size:11px; padding:2px 10px; }
    .modal { position:absolute; top:60px; left:60px; width:420px; background:#ffffcc;
             border:3px outset #d4d0c8; padding:0; z-index:99; }
  </style>
</head>
<body>

{% if show_maintenance %}
<!-- Injected interstitial. A known, dismissable condition: the replay engine
     recovers from this rather than failing, because it is expected noise. -->
<div class="modal" id="ctl00_pnlSysNotice">
  <table width="100%" cellpadding="0" cellspacing="0"><tr>
    <td class="hdr">System Notice</td>
  </tr><tr><td>
    <table cellpadding="8"><tr><td>
      <font size="2"><b>Scheduled maintenance</b></font><br><br>
      <font size="1">Member Services will be unavailable Sunday 02:00-05:00 CT
      for core release 11.4.2. No action is required.</font>
      <br><br>
      <input type="button" class="btn" id="ctl00_btnAckNotice" value="Acknowledge"
             onclick="document.getElementById('ctl00_pnlSysNotice').style.display='none';">
    </td></tr></table>
  </td></tr></table>
</div>
{% endif %}

<table width="100%" cellpadding="0" cellspacing="0"><tr>
  <td class="hdr">{% block heading %}Member Services{% endblock %}</td>
</tr></table>

<table cellpadding="10" cellspacing="0" width="100%"><tr><td>
{% block content %}{% endblock %}
</td></tr></table>

</body>
</html>
