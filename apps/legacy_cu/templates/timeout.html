<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html>
<head><title>Session Expired</title>
<style type="text/css">
 body { background:#d4d0c8; font-family:Verdana,Arial,sans-serif; font-size:11px; }
 .err { background:#fff4e0; border:1px solid #cc8800; color:#884400; padding:10px; }
 input.btn { border:2px outset #d4d0c8; background:#d4d0c8; font-family:Verdana; font-size:11px; padding:2px 12px; }
</style>
</head>
<body>
<br>
<!-- Session expiry breaks out of the frameset, which is exactly what makes it
     dangerous: a naive replay would keep clicking into a dead frame. The
     engine detects this condition explicitly and either re-authenticates or
     escalates. -->
<div class="err" id="ctl00_lblSessionExpired">
  <b>Your session has expired</b><br>
  You have been signed off due to inactivity. Please sign on again to continue.
</div>
<br>
<form method="get" action="/login" target="_top">
  <input type="submit" class="btn" value="Sign On Again">
</form>
</body>
</html>
